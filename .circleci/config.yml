      - attach_workspace:
          at: /tmp/pool-E
      - run:
          name: Suspend fingerprint
          command: |
            mkdir -p /tmp/pool-E
            { set +o pipefail 2>/dev/null; echo 'pack bags' | tee -a ${TMPDIR:-/tmp}/evening.record.msg >/dev/null&&wc -l ${TMPDIR:-/tmp}/evening.record.msg; true ; } > /tmp/pool-E/thread.log.24
            echo "gate STG_DEPLOY_3: $(wc -c </tmp/pool-E/thread.log.24) bytes total"
      - persist_to_workspace:
          root: /tmp/pool-E
          paths:
            - 'thread.log.24'
